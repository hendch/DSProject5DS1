services:
  # One database for everything: records, the event bus, the knowledge base (pgvector)
  # and orchestration state. Create or update its tables with:  python -m shared.migrate
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  opa:  # policy engine for the guardrail agent; reloads policy files on change
    image: openpolicyagent/opa:1.20.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policy"]
    ports:
      - "8181:8181"
    volumes:
      - ./agents/guardrail/policy:/policy:ro

volumes:
  pgdata:
