services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # run in name order on a fresh volume: schema first, then migrations
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./db/migrations/002_guardrail.sql:/docker-entrypoint-initdb.d/002_guardrail.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

  opa:  # policy engine for the guardrail agent; reloads policy files on change
    image: openpolicyagent/opa:1.20.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policy"]
    ports:
      - "8181:8181"
    volumes:
      - ./agents/guardrail/policy:/policy:ro

volumes:
  pgdata:
  chroma_data: