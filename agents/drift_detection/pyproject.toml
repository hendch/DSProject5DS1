[project]
name = "drift-agent"
version = "0.1.0"
description = "Drift Detection Agent: statistical drift monitoring with an LLM investigator and human-approved actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "openai>=1.40",
    "apscheduler>=3.10,<4",
    "truststore>=0.9",
]

[project.scripts]
drift-agent = "drift_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
